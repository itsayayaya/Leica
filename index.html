<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leica Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Mono:wght@300;400&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #E2001A;
      --red-dk: #b8001a;
      --black:  #0a0a0a;
      --white:  #ffffff;
      --off:    #f5f5f5;
      --gray:   #888;
      --lgray:  #ccc;
      --border: #e5e5e5;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--white);
      color: var(--black);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--white);
      border-bottom: 2px solid var(--red);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem;
      height: 56px;
    }

    /* Leica SVG logo */
    .leica-logo {
      display: flex; align-items: center;
      text-decoration: none; flex-shrink: 0;
    }
    .leica-logo svg {
      height: 38px; width: auto; display: block;
    }

    .header-right {
      display: flex; align-items: center; gap: 0.8rem;
    }
    #photo-count-badge {
      font-size: 0.62rem; letter-spacing: 0.12em;
      color: var(--gray); display: none;
    }
    #delete-toggle-btn {
      padding: 0.35rem 0.8rem;
      background: transparent;
      border: 1px solid var(--black);
      color: var(--black);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.1em;
      cursor: pointer; border-radius: 1px;
      transition: background 0.18s, color 0.18s;
      -webkit-tap-highlight-color: transparent;
      display: none;
    }
    #delete-toggle-btn:hover,
    #delete-toggle-btn.active {
      background: var(--red); border-color: var(--red); color: #fff;
    }

    /* ── TABS ── */
    #tabs-wrapper {
      display: none;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; background: var(--white);
    }
    #tabs-wrapper::-webkit-scrollbar { display: none; }
    #tabs {
      display: flex; width: max-content;
      padding: 0 1.5rem;
    }
    .tab-btn {
      padding: 0.7rem 1.1rem;
      background: transparent; border: none;
      border-bottom: 3px solid transparent;
      color: var(--gray); font-family: 'DM Mono', monospace;
      font-size: 0.68rem; letter-spacing: 0.1em;
      cursor: pointer; white-space: nowrap;
      transition: color 0.18s, border-color 0.18s;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--black); }
    .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }

    /* ── STATUS ── */
    #status {
      text-align: center; padding: 4rem 2rem;
      font-size: 0.72rem; letter-spacing: 0.15em; color: var(--gray);
    }
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--lgray); border-top-color: var(--red);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── GALLERY ── */
    #gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 3px;
      background: var(--border);
    }
    @media (max-width: 600px) { #gallery { grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; } }

    .photo-card {
      position: relative; aspect-ratio: 1;
      overflow: hidden; cursor: pointer;
      background: var(--off);
    }
    .photo-card .thumb {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      transition: transform 0.35s ease;
    }
    .photo-card:hover .thumb { transform: scale(1.04); }

    /* delete mode overlay */
    .photo-card .del-check {
      position: absolute; inset: 0;
      background: rgba(226,0,26,0.35);
      display: none; align-items: center; justify-content: center;
      z-index: 5;
    }
    .del-check svg { width: 36px; height: 36px; stroke: #fff; fill: none; stroke-width: 2.5; }
    body.delete-mode .photo-card .del-check { display: flex; opacity: 0; transition: opacity 0.15s; }
    body.delete-mode .photo-card.selected .del-check { opacity: 1; }
    body.delete-mode .photo-card { cursor: pointer; }

    /* subtle hover name */
    .photo-card .name-tag {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 0.5rem 0.6rem;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 100%);
      font-size: 0.6rem; letter-spacing: 0.07em; color: rgba(255,255,255,0.9);
      opacity: 0; transition: opacity 0.2s;
    }
    .photo-card:hover .name-tag { opacity: 1; }

    /* ── DELETE BAR ── */
    #delete-bar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
      background: var(--white); border-top: 2px solid var(--red);
      padding: 0.8rem 1.5rem;
      flex-direction: column; gap: 0.5rem;
    }
    #delete-bar.show { display: flex; }
    #delete-bar-top {
      display: flex; align-items: center; justify-content: space-between; gap: 0.8rem;
    }
    #selected-count { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--gray); }
    .bar-btn {
      padding: 0.5rem 1.2rem;
      font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.1em;
      cursor: pointer; border-radius: 1px; border: 1px solid var(--black);
      background: transparent; color: var(--black);
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .bar-btn:hover { background: var(--black); color: #fff; }
    #confirm-delete-btn {
      background: var(--red); border-color: var(--red); color: #fff;
    }
    #confirm-delete-btn:hover { background: var(--red-dk); border-color: var(--red-dk); }
    #confirm-delete-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #pin-row {
      display: flex; align-items: center; gap: 0.5rem;
    }
    #pin-row label { font-size: 0.65rem; letter-spacing: 0.1em; color: var(--gray); white-space: nowrap; }
    #pin-input {
      font-family: 'DM Mono', monospace; font-size: 0.9rem;
      letter-spacing: 0.4em; text-align: center;
      width: 90px; padding: 0.35rem 0.5rem;
      border: 1px solid var(--border); background: var(--off);
      border-radius: 1px; outline: none; color: var(--black);
      transition: border-color 0.15s;
    }
    #pin-input:focus { border-color: var(--red); }
    #pin-input.error { border-color: var(--red); animation: shake 0.3s; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}
    }
    #pin-msg { font-size: 0.62rem; color: var(--red); letter-spacing: 0.1em; display: none; }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0; background: rgba(10,10,10,0.97);
      z-index: 1000; display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #lightbox.active { display: flex; }
    #lb-img-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      width: 100%; position: relative; overflow: hidden;
      cursor: pointer;
    }
    #lightbox-img {
      max-width: 92vw; max-height: 80vh; object-fit: contain;
      display: block; transition: opacity 0.15s;
      cursor: default; pointer-events: none;
    }
    #lb-spinner {
      position: absolute; width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--red);
      border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
    }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      color: #fff; width: 42px; height: 42px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 10; -webkit-tap-highlight-color: transparent;
      transition: background 0.18s;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.18); }
    .lb-nav svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }
    #lb-prev { left: 0.5rem; } #lb-next { right: 0.5rem; }

    #lb-top {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.8rem 1rem;
      z-index: 20; pointer-events: none;
    }
    #lb-close {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; width: 40px; height: 40px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; -webkit-tap-highlight-color: transparent;
      pointer-events: all; transition: background 0.18s;
    }
    #lb-close:hover { background: rgba(255,255,255,0.25); }
    /* Leica red dot accent in lightbox */
    .lb-dot {
      width: 10px; height: 10px; background: var(--red); border-radius: 50%; flex-shrink: 0;
    }

    #lb-bottom {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 1rem 1rem; gap: 0.5rem;
    }
    #lb-caption { font-size: 0.62rem; color: rgba(255,255,255,0.45); letter-spacing: 0.1em; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #lb-download {
      background: var(--red); color: #fff; border: none;
      padding: 0.55rem 1.1rem; font-family: 'DM Mono', monospace;
      font-size: 0.68rem; letter-spacing: 0.12em;
      cursor: pointer; border-radius: 1px;
      display: flex; align-items: center; gap: 0.4rem;
      text-decoration: none; font-weight: 400;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #lb-download:hover { background: var(--red-dk); }
    #lb-download svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

    /* iOS hint */
    #ios-hint {
      position: fixed; bottom: 5.5rem; left: 50%; transform: translateX(-50%);
      background: rgba(10,10,10,0.92); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8); font-size: 0.66rem; letter-spacing: 0.08em;
      padding: 0.55rem 1.1rem; border-radius: 3px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
      white-space: nowrap; z-index: 2000;
    }
    #ios-hint.show { opacity: 1; }

    footer {
      text-align: center; padding: 2rem 2rem;
      font-size: 0.6rem; letter-spacing: 0.2em; color: var(--lgray);
      border-top: 1px solid var(--border);
    }
    footer span { color: var(--red); }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="leica-logo" href="#">
    <svg height="200" width="200" enable-background="new 0 0 200 200" overflow="visible" version="1.1" viewBox="0 0 200 200" xml:space="preserve" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="100" r="97.5" fill="#ED1C24"/><path d="m157.14 110.77c-2.959 0-2.959-3.251-2.959-4.195 0-2.482 1.948-12.354 7.313-12.354 2.257 0 3.47 1.904 3.47 3.328-1e-3 0.296-1.364 13.221-7.824 13.221m-75.542-16.798c1.616 0.097 2.704 1.253 2.647 2.435-0.266 7.629-9.671 6.447-9.671 6.447s1.535-9.218 7.024-8.882zm98.424 14.081s-2.54 1.83-4.343 1.83c-1.367 0-2.116-1.142-2.116-2.395 0-2.818 4.414-16.707 4.414-16.707l-10.799 0.144-0.564 1.878s-1.575-3.185-7.242-3.185c-10.994 0-17.02 9.479-17.282 15.052-0.047 1.209-0.061 1.381-0.061 1.381-0.255 0.295-4.142 4.719-8.911 4.719-3.816 0-4.451-3.197-4.451-5.239 0-2.218 1.844-10.981 7.047-10.981 2.832 0 4.565 2.463 4.565 2.463l1.528-5.016s-2.415-1.877-7.346-1.891c-10.628-0.014-17.887 7.968-18.142 15.156-0.047 1.071-0.087 1.424-0.074 1.491-0.353 0.427-2.973 3.439-6.373 3.439-2.324 0-2.324-1.813-2.324-2.62 0-1.085 4.595-16.731 4.595-16.731l-12.012 0.182-4.286 15.183s-6.583 4.767-15.788 5.426c-4.746 0.325-6.382-2.551-6.382-4.243v-0.702s1.931 0.125 3.382 0.125c1.128 0 15.156-0.971 15.156-9.557 0-4.904-4.897-6.775-11.108-6.775-11.461 0-19.5 7.111-19.5 15.545 0 7.699 6.584 11.008 15.069 11.008 9.617 0 19.005-5.889 19.005-5.889s0.524 5.889 8.119 5.889c7.836 0 13.97-5.889 13.97-5.889s3.413 5.664 11.209 5.664c7.964 0 14.081-6.443 14.081-6.443s2.133 6.077 10.023 6.077c6.164 0 9.473-4.044 9.473-4.044s1.76 4.044 7.135 4.044c6.553 0 11.475-4.622 11.475-4.622zm-152.85 14.531c-3.033 0.088-5.008-1.928-5.008-3.057 0-2.496 3.063-2.889 5.008-2.751 4.706 0.255 8.75 1.864 8.75 1.864s-4.773 3.82-8.75 3.944m44.8-58.454c3.534 0 4.706 2.868 4.41 5.448-1.72 15.143-16.758 18.609-16.758 18.609s3.735-24.057 12.348-24.057zm110.22 54.202s-25.24 8.793-73.396 8.199c-33.214-0.406-58.538-10.215-58.538-10.215s0.819-1.596 1.357-2.671c3.329-6.788 7.255-20.561 7.255-20.561s22.828-6.361 22.828-24.49c0-5.736-5.334-9.432-10.601-9.657-18.397-0.716-23.5 25.502-24.628 29.96-0.071 0.322-0.098 0.42-0.098 0.42-5.68-0.787-8.881-1.941-8.881-1.941l-1.3 3.537c3.833 1.816 9.405 2.408 9.405 2.408-1.102 7.023-6.557 20.325-6.557 20.325s-5.035-1.669-11.29-1.669c-8.109 0-10.896 3.859-11.095 6.281-0.538 6.258 7.333 9.197 12.828 9.197 10.726 0 16.298-5.788 16.298-5.788s30.167 11.394 61.632 11.394c41.186 0 75.915-10.967 75.915-10.967zm-73.678-41.73c-3.826 0-6.647 1.556-6.647 5.146 0 3.625 3.262 4.622 6.647 4.622 3.406 0 6.507-1.603 6.507-5.298 0-3.708-3.736-4.47-6.507-4.47" fill="#fff"/></svg>
  </a>
  <div class="header-right">
    <span id="photo-count-badge"></span>
    <button id="delete-toggle-btn" onclick="toggleDeleteMode()">ลบรูปภาพ</button>
  </div>
</header>

<!-- TABS -->
<div id="tabs-wrapper"><div id="tabs"></div></div>

<!-- STATUS -->
<div id="status">
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <span>LOADING</span>
  </div>
</div>

<!-- GALLERY -->
<div id="gallery"></div>

<!-- DELETE BAR -->
<div id="delete-bar">
  <div id="delete-bar-top">
    <span id="selected-count">เลือก 0 รูป</span>
    <div style="display:flex;gap:0.5rem;">
      <button class="bar-btn" onclick="selectAll()">เลือกทั้งหมด</button>
      <button class="bar-btn" onclick="toggleDeleteMode()">ยกเลิก</button>
      <button class="bar-btn" id="confirm-delete-btn" disabled onclick="tryDelete()">ลบ</button>
    </div>
  </div>
  <div id="pin-row">
    <label>รหัส:</label>
    <input type="password" id="pin-input" maxlength="6" placeholder="••••" oninput="onPinInput()" />
    <span id="pin-msg">รหัสไม่ถูกต้อง</span>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div id="lb-top">
    <button id="lb-close" onclick="closeLightbox()">✕</button>
    <div class="lb-dot"></div>
  </div>
  <div id="lb-img-wrap">
    <div id="lb-spinner"></div>
    <img id="lightbox-img" src="" alt="preview" />
    <button class="lb-nav" id="lb-prev" onclick="navigate(-1)">
      <svg viewBox="0 0 24 24" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="lb-nav" id="lb-next" onclick="navigate(1)">
      <svg viewBox="0 0 24 24" stroke-width="1.5"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
  </div>
  <div id="lb-bottom">
    <span id="lb-caption"></span>
    <a id="lb-download" href="#" onclick="handleDownload(event)">
      <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      บันทึกภาพ
    </a>
  </div>
</div>

<div id="ios-hint">กดรูปค้างไว้ → เลือก "บันทึกไปยังรูปภาพ"</div>

<footer>LEICA GALLERY · GOOGLE DRIVE · <span id="foot-count"></span></footer>

<script>
  const FOLDER_ID  = '1etO0sMe19Oc-AfN3E9e-3-tLm2yYiuZS';
  const API_KEY    = 'AIzaSyD1xK5oJlAVpvRpqo3xlDkfpTbt1wwuAQA';
  const DELETE_PIN = '3333';

  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent);

  let allPhotos = [], photos = [], currentIndex = 0, activeDay = null;
  let deleteMode = false, selectedIds = new Set();

  function toDateLabel(iso) {
    if (!iso) return 'ไม่ทราบวันที่';
    const d = new Date(iso);
    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  }

  /* ── LOAD ── */
  async function loadGallery() {
    allPhotos = [];
    try {
      let pageToken = '';
      do {
        const url = `https://www.googleapis.com/drive/v3/files`
          + `?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'image/'`
          + `&fields=nextPageToken,files(id,name,createdTime)`
          + `&orderBy=createdTime+desc`
          + `&key=${API_KEY}&pageSize=100`
          + (pageToken ? `&pageToken=${pageToken}` : '');
        const d = await (await fetch(url)).json();
        if (d.error) throw new Error(d.error.message);
        allPhotos.push(...(d.files||[]));
        pageToken = d.nextPageToken||'';
      } while (pageToken);

      document.getElementById('status').style.display = 'none';
      const cnt = allPhotos.length;
      document.getElementById('photo-count-badge').textContent = `${cnt} ภาพ`;
      document.getElementById('photo-count-badge').style.display = 'inline';
      document.getElementById('delete-toggle-btn').style.display = 'inline-block';
      document.getElementById('foot-count').textContent = `${cnt} PHOTOS`;
      buildTabs();
    } catch(err) {
      document.getElementById('status').innerHTML = `<p style="color:var(--red);letter-spacing:.1em">${err.message}</p>`;
    }
  }

  /* ── TABS ── */
  function buildTabs() {
    const days = [...new Set(allPhotos.map(p => toDateLabel(p.createdTime)))];
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    days.forEach(day => tabsEl.appendChild(makeTabBtn(day, day)));
    tabsEl.appendChild(makeTabBtn('ทั้งหมด', 'all'));
    document.getElementById('tabs-wrapper').style.display = 'block';
    showTab(days[0]||'all');
  }
  function makeTabBtn(label, key) {
    const b = document.createElement('button');
    b.className='tab-btn'; b.textContent=label; b.dataset.key=key;
    b.onclick=()=>showTab(key);
    return b;
  }
  function showTab(key) {
    activeDay = key;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key===key));
    photos = key==='all' ? allPhotos : allPhotos.filter(p=>toDateLabel(p.createdTime)===key);
    selectedIds.clear();
    updateDeleteBar();
    renderGallery();
  }

  /* ── RENDER ── */
  function renderGallery() {
    const g = document.getElementById('gallery');
    g.innerHTML='';
    photos.forEach((photo, idx) => {
      const thumb = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w400`;
      const card  = document.createElement('div');
      card.className='photo-card';
      card.dataset.id=photo.id;
      card.onclick=()=>onCardClick(idx, photo.id);

      const div = document.createElement('div');
      div.className='thumb';
      lazyObs.observe(div);
      div.dataset.src=thumb;

      card.innerHTML=`<div class="del-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 12 4 18"/></svg></div><div class="name-tag">${photo.name}</div>`;
      card.insertBefore(div, card.firstChild);
      g.appendChild(card);
    });
  }

  /* lazy loader */
  const lazyObs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const src=e.target.dataset.src;
        if(src){ e.target.style.backgroundImage=`url(${src})`; delete e.target.dataset.src; }
        lazyObs.unobserve(e.target);
      }
    });
  },{rootMargin:'250px'});

  /* ── CARD CLICK ── */
  function onCardClick(idx, id) {
    if (deleteMode) {
      const card = document.querySelector(`.photo-card[data-id="${id}"]`);
      if (selectedIds.has(id)) { selectedIds.delete(id); card.classList.remove('selected'); }
      else { selectedIds.add(id); card.classList.add('selected'); }
      updateDeleteBar();
    } else {
      openLightbox(idx);
    }
  }

  /* ── DELETE MODE ── */
  function toggleDeleteMode() {
    deleteMode = !deleteMode;
    document.body.classList.toggle('delete-mode', deleteMode);
    document.getElementById('delete-toggle-btn').classList.toggle('active', deleteMode);
    document.querySelectorAll('.photo-card').forEach(c=>c.classList.remove('selected'));
    selectedIds.clear();
    document.getElementById('pin-input').value='';
    document.getElementById('pin-msg').style.display='none';
    updateDeleteBar();
  }

  function updateDeleteBar() {
    const bar = document.getElementById('delete-bar');
    const cnt = selectedIds.size;
    document.getElementById('selected-count').textContent=`เลือก ${cnt} รูป`;
    document.getElementById('confirm-delete-btn').disabled = cnt===0;
    bar.classList.toggle('show', deleteMode);
  }

  function selectAll() {
    photos.forEach(p=>{
      selectedIds.add(p.id);
      const c=document.querySelector(`.photo-card[data-id="${p.id}"]`);
      if(c) c.classList.add('selected');
    });
    updateDeleteBar();
  }

  function onPinInput() {
    document.getElementById('pin-msg').style.display='none';
    document.getElementById('pin-input').classList.remove('error');
  }

  function tryDelete() {
    const pin = document.getElementById('pin-input').value;
    const input = document.getElementById('pin-input');
    const msg = document.getElementById('pin-msg');
    if (pin !== DELETE_PIN) {
      input.classList.add('error');
      msg.style.display='inline';
      setTimeout(()=>input.classList.remove('error'),400);
      return;
    }
    // confirmed — remove from local array (actual Drive deletion requires OAuth)
    const toDelete = new Set(selectedIds);
    allPhotos = allPhotos.filter(p=>!toDelete.has(p.id));
    photos    = photos.filter(p=>!toDelete.has(p.id));
    toDelete.forEach(id=>{
      document.querySelector(`.photo-card[data-id="${id}"]`)?.remove();
    });
    selectedIds.clear();
    msg.style.display='none';
    input.value='';
    document.getElementById('photo-count-badge').textContent=`${allPhotos.length} ภาพ`;
    document.getElementById('foot-count').textContent=`${allPhotos.length} PHOTOS`;
    updateDeleteBar();
    toggleDeleteMode();
  }

  /* ── LIGHTBOX ── */
  function openLightbox(idx) {
    currentIndex=idx; updateLightbox();
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow='hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow='';
  }
  function navigate(dir) {
    currentIndex=(currentIndex+dir+photos.length)%photos.length;
    updateLightbox();
  }
  function updateLightbox() {
    const p=photos[currentIndex];
    const img=document.getElementById('lightbox-img');
    const sp=document.getElementById('lb-spinner');
    img.style.opacity='0'; sp.style.display='block';
    img.onload=img.onerror=()=>{sp.style.display='none';img.style.opacity='1';};
    img.src=`https://drive.google.com/thumbnail?id=${p.id}&sz=w1600`;
    document.getElementById('lb-caption').textContent=`${currentIndex+1} / ${photos.length}  ·  ${p.name}`;
    document.getElementById('lb-download').href=`https://drive.google.com/thumbnail?id=${p.id}&sz=w4096`;
    document.getElementById('lb-download').download=p.name;
  }

  function handleDownload(e) {
    if (isIOS) {
      e.preventDefault();
      const p=photos[currentIndex];
      window.open(`https://drive.google.com/thumbnail?id=${p.id}&sz=w4096`,'_blank');
      const h=document.getElementById('ios-hint');
      h.classList.add('show');
      setTimeout(()=>h.classList.remove('show'),4000);
    }
  }

  /* swipe */
  let tx=0;
  document.getElementById('lb-img-wrap').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
  document.getElementById('lb-img-wrap').addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>50) navigate(dx<0?1:-1);
  },{passive:true});

  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });
  document.getElementById('lb-img-wrap').addEventListener('click', function(e) {
    // close if clicking the background area (not nav buttons or spinner)
    if (e.target === this) closeLightbox();
  });
  document.addEventListener('keydown',e=>{
    if(!document.getElementById('lightbox').classList.contains('active'))return;
    if(e.key==='Escape')closeLightbox();
    if(e.key==='ArrowLeft')navigate(-1);
    if(e.key==='ArrowRight')navigate(1);
  });

  loadGallery();
</script>
</body>
</html>
