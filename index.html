<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Gallery</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>

<div class="banner-container">
    <img src="banner.gif" width="100%" height="auto">
</div>

<h2>Leica</h2>

<p id="count"></p>

</header>

<div id="gallery"></div>

<div id="lightbox">
  <img id="lightbox-img">
</div>

<span id="close">×</span>

<img id="lightbox-img">
<img
  src="${photo.image}"
  loading="lazy"
  onclick="showImage('${photo.full}')">
  <a
  class="download"
  href="${photo.download}"
  download>
  Download
</a>
  
</div>

<script src="script.js"></script>

</body>
</html>
